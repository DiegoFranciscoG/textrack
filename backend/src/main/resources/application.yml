# Configuración base. Los secretos NO tienen valor por defecto: si falta la variable, la app no arranca.
spring:
  application:
    name: textrack-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

logging:
  level:
    root: INFO
    io.github.diegofranciscog.textrack: INFO

app:
  zone: America/Guayaquil
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: textrack
    access-token-minutes: 15
    refresh-token-days: 7
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
    login-attempts-per-minute: 5
  tickets:
    hmac-secret: ${TICKET_HMAC_SECRET}
    key-id: ${TICKET_KEY_ID:k1}
  quality:
    fabric-max-points-per-100-sq-yd: ${APP_FABRIC_MAX_POINTS:40}
  production:
    overcut-tolerance: 0.05
    max-scan-age-days: 30
    max-clock-skew-minutes: 5
  demo:
    simulator-enabled: false
    simulator-interval-seconds: 20
