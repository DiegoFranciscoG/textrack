# Render Blueprint (plan gratuito): API en Docker. La base de datos vive en Neon (el Postgres gratis de Render
# caduca a los 30 días). Los valores sync:false se completan en el panel de Render; generateValue crea un
# secreto aleatorio de 256 bits que nunca pasa por el repositorio.
services:
  - type: web
    name: textrack-api
    runtime: docker
    plan: free
    region: ohio
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: DB_URL
        sync: false # jdbc:postgresql://<host-neon>/textrack?sslmode=require
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: JWT_SECRET
        generateValue: true
      - key: TICKET_HMAC_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # https://<proyecto>.vercel.app
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_VIEWER_PASSWORD
        sync: false # contraseña pública del usuario de solo lectura (la del README)
