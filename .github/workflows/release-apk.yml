# Publica el APK de la tablet en GitHub Releases al crear un tag vX.Y.Z.
# Firma: si existen los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y
# ANDROID_KEY_PASSWORD se firma el release; la URL de la API sale de la variable del repositorio TEXTRACK_API_URL.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Keystore desde secretos
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sin keystore: no se puede firmar el release" && exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK firmado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TEXTRACK_API_URL: ${{ vars.TEXTRACK_API_URL }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PtextrackApiUrl="${TEXTRACK_API_URL%/}/"
      - name: Publicar en GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "textrack-scanner-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "textrack-scanner-${GITHUB_REF_NAME}.apk" \
            --title "textrack scanner $GITHUB_REF_NAME" --notes "APK de la tablet de planta (Android 8+)."
